<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="description">Map of the browser, Express server, four routers, ten library modules, configuration, and JSON database. The numbered sequence follows a successful order. The invoice module is highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#62748b"/>
    </marker>
    <style>
      text { font-family: system-ui, sans-serif; fill: #16253a; font-size: 14px; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .name { font-size: 15px; font-weight: 700; }
      .detail { font-size: 13px; fill: #41546b; }
      .panel { fill: #f4f7fb; stroke: #d5deea; }
      .box { fill: #fff; stroke: #b9c7d8; }
      .invoice { fill: #f1e8ff; stroke: #9060c2; }
      .invoice-text { fill: #5b258a; }
      .wire { fill: none; stroke: #62748b; stroke-width: 1.6; }
      .arrow { marker-end: url(#arrow); }
      .step { fill: #215a77; }
      .number { fill: white; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fff"/>
  <text x="28" y="48" class="title">ShopLedger architecture</text>
  <text x="29" y="75" class="detail">Node / Express POS, Khata ledger and printable GST invoices</text>
  <rect x="953" y="39" width="18" height="18" rx="4" class="invoice"/>
  <text x="980" y="53" class="detail">Invoice ticket module</text>

  <rect x="28" y="98" width="630" height="674" rx="14" class="panel"/>
  <rect x="678" y="98" width="494" height="674" rx="14" class="panel"/>
  <text x="48" y="128" class="heading">Application map</text>
  <text x="698" y="128" class="heading">Placing an order</text>

  <!-- Entry points and the API branch -->
  <rect x="48" y="148" width="214" height="62" rx="7" class="box"/>
  <text x="61" y="172" class="name">public/</text>
  <text x="61" y="192" class="detail">POS UI · index.html, js/app.js</text>

  <path d="M262 179H301" class="wire arrow"/>
  <rect x="306" y="148" width="332" height="62" rx="7" class="box"/>
  <text x="319" y="170" class="name">server.js</text>
  <text x="319" y="190" class="detail">Serves public/ · GET /orders/:id/invoice</text>

  <path d="M472 210V220H60V241" class="wire arrow"/>
  <text x="69" y="239" class="detail">routes/ · mounted under /api</text>
  <rect x="48" y="248" width="287" height="48" rx="7" class="box"/>
  <text x="60" y="267" class="name">products.js</text>
  <text x="60" y="285" class="detail">Product catalog and active coupons</text>
  <rect x="351" y="248" width="287" height="48" rx="7" class="box"/>
  <text x="363" y="267" class="name">orders.js</text>
  <text x="363" y="285" class="detail">Place, list, view and cancel orders</text>
  <rect x="48" y="302" width="287" height="48" rx="7" class="box"/>
  <text x="60" y="321" class="name">customers.js</text>
  <text x="60" y="339" class="detail">Khata accounts and settlements</text>
  <rect x="351" y="302" width="287" height="48" rx="7" class="box"/>
  <text x="363" y="321" class="name">reports.js</text>
  <text x="363" y="339" class="detail">Dashboard, reconciliation, preview, export</text>

  <path d="M343 351V370" class="wire arrow"/>
  <text x="48" y="378" class="heading">lib/</text>
  <text x="84" y="378" class="detail">Business logic and persistence</text>

  <g>
    <rect x="48" y="389" width="287" height="48" rx="7" class="box"/>
    <text x="60" y="408" class="name">inventory.js</text>
    <text x="60" y="426" class="detail">Product lookup and stock changes</text>
    <rect x="351" y="389" width="287" height="48" rx="7" class="box"/>
    <text x="363" y="408" class="name">pricing.js</text>
    <text x="363" y="426" class="detail">Checkout totals via coupons.js and tax.js</text>

    <rect x="48" y="443" width="287" height="48" rx="7" class="box"/>
    <text x="60" y="462" class="name">coupons.js</text>
    <text x="60" y="480" class="detail">Validates codes and computes discounts</text>
    <rect x="351" y="443" width="287" height="48" rx="7" class="box"/>
    <text x="363" y="462" class="name">tax.js</text>
    <text x="363" y="480" class="detail">GST rate lookup and CGST / SGST split</text>

    <rect x="48" y="497" width="287" height="48" rx="7" class="box"/>
    <text x="60" y="516" class="name">ledger.js</text>
    <text x="60" y="534" class="detail">Khata charges, reversals and repayments</text>
    <rect x="351" y="497" width="287" height="48" rx="7" class="box"/>
    <text x="363" y="516" class="name">orders.js</text>
    <text x="363" y="534" class="detail">Order records and cancellation</text>

    <rect x="48" y="551" width="287" height="48" rx="7" class="box"/>
    <text x="60" y="570" class="name">dates.js</text>
    <text x="60" y="588" class="detail">Date formatting and filter keys</text>
    <rect x="351" y="551" width="287" height="48" rx="7" class="invoice"/>
    <text x="363" y="570" class="name invoice-text">invoice.js</text>
    <text x="363" y="588" class="detail invoice-text">Recomputes figures and renders print HTML</text>

    <rect x="48" y="605" width="287" height="48" rx="7" class="box"/>
    <text x="60" y="624" class="name">reports.js</text>
    <text x="60" y="642" class="detail">Compares invoice.js figures with saved orders</text>
    <rect x="351" y="605" width="287" height="48" rx="7" class="box"/>
    <text x="363" y="624" class="name">store.js</text>
    <text x="363" y="642" class="detail">Reads and rewrites JSON · appends audit</text>
  </g>

  <path d="M494 653V674" class="wire arrow"/>
  <rect x="48" y="678" width="287" height="66" rx="7" class="box"/>
  <text x="60" y="701" class="name">config.js</text>
  <text x="60" y="722" class="detail">Shop settings, rates and coupon rules</text>
  <rect x="351" y="678" width="287" height="66" rx="7" class="box"/>
  <text x="363" y="701" class="name">data/db.json</text>
  <text x="363" y="722" class="detail">Products, orders, Khata, audit and counters</text>

  <!-- Successful order sequence -->
  <path d="M713 167V660" class="wire"/>
  <g>
    <circle cx="713" cy="166" r="14" class="step"/><text x="713" y="171" class="number">1</text>
    <text x="738" y="164" class="name">Send the cart</text>
    <text x="738" y="183" class="detail">public/js/app.js → POST /api/orders</text>
    <text x="738" y="201" class="detail">server.js dispatches to routes/orders.js.</text>

    <circle cx="713" cy="239" r="14" class="step"/><text x="713" y="244" class="number">2</text>
    <text x="738" y="237" class="name">Read and check inventory</text>
    <text x="738" y="256" class="detail">store.read() loads data/db.json.</text>
    <text x="738" y="274" class="detail">inventory.find() resolves catalog data; check() tests stock.</text>

    <circle cx="713" cy="312" r="14" class="step"/><text x="713" y="317" class="number">3</text>
    <text x="738" y="310" class="name">Price the order</text>
    <text x="738" y="329" class="detail">pricing.subtotal() and coupons.validate() check eligibility.</text>
    <text x="738" y="347" class="detail">pricing.computeTotals() allocates the coupon across lines</text>
    <text x="738" y="365" class="detail">and uses tax.getRateForItem() for GST on discounted values.</text>

    <circle cx="713" cy="403" r="14" class="step"/><text x="713" y="408" class="number">4</text>
    <text x="738" y="401" class="name">Charge the customer if paying on Khata</text>
    <text x="738" y="420" class="detail">ledger.chargeOrderToKhata() checks the credit limit</text>
    <text x="738" y="438" class="detail">and updates the customer's billed total and balance.</text>

    <circle cx="713" cy="476" r="14" class="step"/><text x="713" y="481" class="number">5</text>
    <text x="738" y="474" class="name">Deduct stock and add the order</text>
    <text x="738" y="493" class="detail">inventory.reserve() reduces physical stock.</text>
    <text x="738" y="511" class="detail">orders.add() assigns the ID and stores items and totals.</text>

    <circle cx="713" cy="549" r="14" class="step"/><text x="713" y="554" class="number">6</text>
    <text x="738" y="547" class="name">Save changes and return the order</text>
    <text x="738" y="566" class="detail">store.appendAudit() records ORDER_CREATED.</text>
    <text x="738" y="584" class="detail">store.write() rewrites data/db.json. The route returns 201.</text>

    <rect x="698" y="629" width="454" height="115" rx="8" class="invoice"/>
    <circle cx="713" cy="659" r="14" class="step"/><text x="713" y="664" class="number">7</text>
    <text x="738" y="657" class="name invoice-text">Open the invoice separately</text>
    <text x="738" y="677" class="detail invoice-text">GET /orders/:id/invoice → store.read() → orders.get()</text>
    <text x="738" y="696" class="detail invoice-text">invoice.render() calls computeInvoiceFigures().</text>
    <text x="738" y="715" class="detail invoice-text">It uses config.js and saved items to recalculate totals.</text>
  </g>
</svg>
